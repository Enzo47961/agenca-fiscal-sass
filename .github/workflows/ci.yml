name: CI

# Item A1 da auditoria. É a causa-raiz sistêmica por trás de vários achados:
# sem isto, nada garante que um commit em `main` compila, passa no lint e passa
# nos testes — e o repositório já ficou dias num estado em que não passava.
#
# Roda exatamente a Definition of Done do CLAUDE.md, na mesma ordem:
#   typecheck && lint && test && build
#
# Honestidade sobre o alcance: este workflow garante que todo commit em `main`
# é verde. Ele NÃO teria pego o incidente de 06–10/08/2026 (commits cuja
# mensagem não correspondia ao conteúdo), porque o código antigo também
# compilava e passava nos testes. Para esse tipo de problema a defesa é a
# verificação descrita na §3.1 do HANDOFF, não CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior do mesmo branch — não faz sentido
# esperar o CI de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # O `next build` pré-renderiza páginas que chamam `publicEnv()` (login,
      # landing), e o schema Zod recusa valor ausente ou malformado. Estes são
      # valores de FORMA VÁLIDA e sem nenhum segredo: existem só para o build
      # ter o que validar. Nada aqui alcança um projeto Supabase real — e é
      # proposital que não alcance, porque CI não deve tocar dado de ninguém.
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-anon-de-ci-sem-valor-real
      NEXT_PUBLIC_WHATSAPP_SUPORTE: "5511999999999"

    steps:
      - uses: actions/checkout@v4

      # Node 22, e nao 20, por duas razoes que apareceram no log do proprio CI:
      # o runner ja forca as actions para Node 24 avisando que 20 esta
      # descontinuado, e o @supabase/supabase-js declara `engines: node >=22` —
      # cada instalacao imprimia EBADENGINE e um aviso de fim de suporte.
      #
      # Nada aqui obriga a Vercel: desde que o build voltou a rodar la, a versao
      # de producao vem das configuracoes do projeto, nao deste arquivo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` e não `npm install`: respeita o package-lock.json à risca, e
      # falha se ele estiver dessincronizado do package.json — que é
      # exatamente o que se quer saber num CI.
      - name: Instalar dependências
        run: npm ci

      # Os quatro passos ficam separados de propósito: quando um quebra, o
      # nome do step já diz qual é, sem abrir o log.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # APLICAR MIGRATIONS EM PRODUCAO
  #
  # POR QUE ESTE JOB EXISTE. Em 15/08/2026 a tela de relatorios quebrou em
  # producao com "server-side exception": o codigo tinha ido ao ar dependendo de
  # `relatorio_carteira()`, e o banco de producao estava seis migrations atras.
  # A causa nao foi tecnica — foi humana: `db push` dependia de alguem lembrar.
  #
  # Automatizar tira isso da lembranca. O portao continua sendo o PR: migration
  # so chega aqui depois de revisada e com o CI verde.
  #
  # SO EM PUSH NA MAIN, e depois do DoD passar. Em pull_request nao roda — PR
  # nao pode alterar o banco de producao.
  #
  # A CORRIDA COM O DEPLOY ESTA FECHADA. Antes, a Vercel publicava pelo proprio
  # gatilho de git EM PARALELO a este job: havia uma janela em que o codigo novo
  # podia estar no ar antes de a migration terminar — exatamente o que quebrou a
  # tela de relatorios em 15/08. Agora o `vercel.json` desliga o deploy
  # automatico da `main` e quem publica e o job `deploy`, abaixo, que so comeca
  # depois que este aqui termina bem.
  # ---------------------------------------------------------------------------
  migrations:
    name: Migrations em producao
    needs: dod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `concurrency` proprio: duas execucoes aplicando migration ao mesmo tempo
    # e o unico jeito de corromper o historico. Sem `cancel-in-progress` — um
    # push novo NAO pode cancelar uma migration no meio.
    concurrency:
      group: migrations-producao
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # O REF DO PROJETO NAO E SEGREDO — e por isso esta aqui, em claro.
      #
      # Ele ja e publico: aparece em NEXT_PUBLIC_SUPABASE_URL, que por
      # definicao vai embutido no bundle do navegador. Guardar em secret nao
      # protegia nada e criou um modo de falha — o primeiro merge quebrou com
      # "Invalid project ref format", porque o secret chegou vazio ou com a URL
      # inteira colada no lugar do ref.
      #
      # Constante aqui: visivel, conferivel, e uma coisa a menos para
      # configurar. Secret e para o que de fato precisa ser secreto — o token e
      # a senha do banco, abaixo.
      - name: Aplicar migrations pendentes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref spxiaucinjsgbipaormf
          # `--yes` porque nao ha ninguem para responder a confirmacao: sem
          # TTY, o prompt do db push falha em vez de assumir sim.
          supabase db push --yes

  # ---------------------------------------------------------------------------
  # DEPLOY EM PRODUCAO
  #
  # POR QUE O DEPLOY SAIU DA VERCEL E VEIO PARA CA. Enquanto ela publicava pelo
  # gatilho de git, deploy e migration corriam em paralelo e nada garantia a
  # ordem. Encadeados aqui, a garantia e estrutural: `needs: migrations` so
  # libera este job se o banco ja estiver em dia.
  #
  # A ORDEM CERTA E ESTA. Migration primeiro, codigo depois. O banco novo
  # aguenta o codigo velho — coluna a mais nao incomoda quem nao a le. O
  # contrario nao vale: codigo novo contra banco velho e a tela de erro que o
  # usuario viu.
  #
  # SE O DEPLOY FALHAR, producao fica na versao anterior, funcionando, com o
  # banco ja migrado. E o desfecho seguro dos dois possiveis.
  #
  # `vercel.json` DESLIGA o deploy automatico da `main`. Branch de PR continua
  # gerando preview normalmente — preview nao toca em producao e e util antes do
  # merge.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy em producao
    needs: migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    env:
      # NAO SAO SEGREDOS, e por isso estao em claro — mesma regra que trouxe o
      # ref do Supabase para ca. Aparecem na URL do painel e nao dao acesso a
      # nada sozinhos; quem autentica e o VERCEL_TOKEN.
      #
      # Sao o NOME do projeto e o SLUG do time, e nao os ids `prj_`/`team_`: a
      # primeira tentativa usou os ids via VERCEL_ORG_ID/VERCEL_PROJECT_ID e o
      # `vercel pull` respondeu "Could not retrieve Project Settings". Estes
      # dois foram verificados funcionando nesta conta antes de entrar aqui.
      VERCEL_PROJETO: agenca-fiscal-sass-qgva
      VERCEL_ESCOPO: enzo47961s-projects

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # `link` EXPLICITO. A forma documentada — exportar VERCEL_ORG_ID e
      # VERCEL_PROJECT_ID — falhou com "Could not retrieve Project Settings" na
      # CLI 59. Nomear projeto e escopo resolve e e mais legivel: da para
      # conferir a olho contra o painel.
      - name: Vincular projeto
        run: vercel link --yes --project "$VERCEL_PROJETO" --scope "$VERCEL_ESCOPO" --token="${{ secrets.VERCEL_TOKEN }}"

      # O BUILD ACONTECE NA VERCEL, nao aqui, e a razao e concreta: TODAS as
      # variaveis de ambiente deste projeto sao do tipo `Sensitive`, que e
      # write-only por definicao — `vercel pull` nao consegue le-las de volta.
      #
      # A primeira versao deste job compilava no CI e publicava com
      # `--prebuilt`. O build quebrou em
      #
      #   ZodError: NEXT_PUBLIC_SUPABASE_URL — Invalid url
      #   WARNING! Build not running on Vercel. System environment variables
      #   will not be available.
      #
      # ...porque as variaveis chegaram vazias. Compilar fora da Vercel so
      # funcionaria tornando-as legiveis no painel, o que e piorar a seguranca
      # para ganhar conveniencia de pipeline. Nao vale a troca.
      #
      # `deploy` sem `--prebuilt` envia o codigo e a Vercel compila na
      # infraestrutura dela, onde as sensiveis existem. O que perdemos e a
      # garantia de que o artefato publicado foi compilado por este job — mas o
      # `dod`, acima, ja provou que este commit compila.
      #
      # A ORDEM, que e o ponto de tudo isto, continua garantida: `needs:
      # migrations` impede que este job comece antes de o banco estar em dia.
      - name: Publicar
        run: vercel deploy --prod --scope "$VERCEL_ESCOPO" --token="${{ secrets.VERCEL_TOKEN }}"
